[project]
name = "autonomous-vehicle-simulator"
dynamic = ["version"]                     # single source of truth: src/__init__.py
description = "A neural network learns to drive a car around a track (didactic project): GA and DQN."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
app = ["pygame-ce>=2.5"]
web = ["pygbag>=0.9"]
docs = ["reportlab>=4"]                   # tutorial -> PDF
build = ["pyinstaller>=6"]               # native executable
dev = ["pytest>=8", "ruff>=0.6", "pygame-ce>=2.5", "reportlab>=4", "pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]   # installs src/core, src/app, src/tracks as core, app, tracks

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip(): pairings are intentional and same-length

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: end-to-end learning test, slow"]
